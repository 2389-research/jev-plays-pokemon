[project]
name = "pokemon-agent"
version = "0.1.0"
description = "Play Pokemon Red via the PyBoy Game Boy emulator"
requires-python = ">=3.12"
dependencies = [
    "pyboy",
    "pydantic",
    "httpx",
    "openai",
    "pillow",
    "numpy",
    "python-dotenv",
    "typesafe-sdk==0.6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_agent"]
