<!doctype html>
<title>Pokémon Agent — Run Viewer</title>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:#111; color:#ddd; }
  header { padding: 8px 12px; background:#000; position:sticky; top:0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  header input[type=range]{ flex:1; min-width:200px; }
  .wrap { display:flex; gap:16px; padding:12px; align-items:flex-start; flex-wrap:wrap; }
  img#screen { image-rendering: pixelated; width:480px; max-width:100%; background:#000; border:1px solid #333; }
  #state { flex:1; min-width:320px; }
  .k { color:#7aa2f7; } .v { color:#e0af68; } .muted{color:#888;}
  table { border-collapse:collapse; } td,th{ padding:1px 8px 1px 0; text-align:left; }
  .ev { color:#9ece6a; } .badge{ background:#222; border:1px solid #444; border-radius:4px; padding:1px 6px; margin-right:6px;}
  h3 { margin: 12px 0 4px; color:#bb9af7; }
  pre { white-space:pre-wrap; margin:2px 0; }
</style>
<header>
  <button id=prev>◀</button>
  <input type=range id=slider min=0 value=0>
  <button id=next>▶</button>
  <span id=pos class=muted></span>
  <label class=muted><input type=checkbox id=play> auto</label>
</header>
<div class=wrap>
  <img id=screen alt="(no screenshot this step)">
  <div id=state></div>
</div>
<script>
let steps = [], i = 0;
const $ = id => document.getElementById(id);
async function load() {
  const txt = await (await fetch('log.jsonl')).text();
  steps = txt.trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  $('slider').max = Math.max(0, steps.length - 1);
  render();
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render() {
  if (!steps.length) { $('state').textContent = 'no steps in log.jsonl'; return; }
  i = Math.max(0, Math.min(i, steps.length - 1));
  $('slider').value = i;
  const r = steps[i];
  $('pos').textContent = `step ${r.step} — ${steps.length} logged`;
  $('screen').src = r.shot ? r.shot + '?' + r.step : '';
  const p = r.player || {};
  const npcs = (r.npcs||[]).map(n => `<tr><td>(${n.x},${n.y})</td><td>${esc(n.sprite)}</td><td class=muted>${esc(n.kind)}</td><td class=muted>${esc(n.facing)}</td></tr>`).join('');
  const evs = (r.events||[]).map(e => `<span class="badge ev">${esc(e.kind)}${e.query?': '+esc(e.query):''}${e.intent?': '+esc(e.intent):''}${e.reason?' — '+esc(e.reason):''}${e.score!==undefined?' '+e.score:''}</span>`).join(' ');
  const f = r.facing || {};
  $('state').innerHTML = `
    <div><span class=k>map</span> <span class=v>${r.map_id}</span> ${esc(r.map_name||'')} &nbsp; <span class=k>pos</span> <span class=v>(${p.x},${p.y})</span> facing ${esc(p.facing)} ${p.is_outdoor?'· outdoor':'· indoor'}</div>
    <div><span class=k>ctx</span> ${esc((r.context||{}).kind)} ${ (r.context||{}).screen_text ? '· “'+esc((r.context).screen_text)+'”':''}</div>
    <div><span class=k>facing</span> ${f.can_interact ? '👉 '+esc((f.facing_sprite||{}).sprite||'?')+' at ('+((f.facing_sprite||{}).x)+','+((f.facing_sprite||{}).y)+')' : '<span class=muted>nothing to interact with</span>'}</div>
    ${evs ? '<h3>events</h3>'+evs : ''}
    <h3>action → result</h3>
    <pre><span class=v>${esc(JSON.stringify(r.action))}</span> → ${esc(r.result)} ${r.detail?'· '+esc(r.detail):''}</pre>
    <h3>party / items</h3>
    <pre>${esc((r.party||[]).join(', ')||'—')}\nitems: ${esc((r.items||[]).join(', ')||'—')}</pre>
    <h3>npcs / objects (${(r.npcs||[]).length})</h3>
    <table>${npcs||'<tr><td class=muted>none</td></tr>'}</table>
    ${r.state ? `<h3>save state</h3><span class=muted>${esc(r.state)} (reload to inspect this exact moment)</span>`:''}
  `;
}
$('slider').oninput = e => { i = +e.target.value; render(); };
$('prev').onclick = () => { i--; render(); };
$('next').onclick = () => { i++; render(); };
let timer=null;
$('play').onchange = e => { if(e.target.checked){ timer=setInterval(()=>{ if(i<steps.length-1){i++;render();}else{$('play').checked=false;clearInterval(timer);} },400);} else clearInterval(timer); };
document.onkeydown = e => { if(e.key==='ArrowLeft'){i--;render();} if(e.key==='ArrowRight'){i++;render();} };
load();
</script>
